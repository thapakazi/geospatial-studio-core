# Builds the two images this deployment needs and publishes them to GHCR.
#
# This workflow exists ONLY on the `build` branch — our integration branch —
# and is deliberately kept off the branches we send upstream. Rebuild by
# merging into `build`:
#
#   git fetch origin && git checkout build
#   git merge origin/main                        # pull upstream changes
#   git merge feat/optional-object-storage-credentials
#   git push fork build
#
# workflow_dispatch also builds any branch by hand from the Actions tab, and
# can pick a single image instead of both.

name: Build and publish images

on:
  push:
    branches: [build]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        options: [all, gateway, pipelines]
        default: all

env:
  REGISTRY: ghcr.io

jobs:
  # The matrix is built here rather than declared inline because the job-level
  # `if:` cannot see the `matrix` context — filtering on the dispatch input has
  # to happen before the matrix exists.
  plan:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WANT: ${{ github.event.inputs.image || 'all' }}
        run: |
          cat > images.json <<'JSON'
          [
            {"key":"gateway",
             "name":"geostudio-gateway",
             "context":".",
             "dockerfile":"Dockerfile",
             "heavy":false},
            {"key":"pipelines",
             "name":"geostudio-pipelines",
             "context":"pipelines",
             "dockerfile":"pipelines/Dockerfile",
             "heavy":true}
          ]
          JSON
          if [ "$WANT" = "all" ]; then
            SEL=$(jq -c '{include: .}' images.json)
          else
            SEL=$(jq -c --arg k "$WANT" '{include: [.[] | select(.key == $k)]}' images.json)
          fi
          echo "Selected: $SEL"
          echo "matrix=$SEL" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # The pipelines image pulls miniconda plus GDAL and ~36 Python
      # requirements; a stock runner can run out of disk partway through.
      - name: Free disk space
        if: matrix.heavy
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          # `latest` tracks `build`, not the repo's default branch — `build` is
          # the branch we actually deploy from.
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'build' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      # linux/amd64 only, on purpose: the gateway Dockerfile hardcodes a
      # linux/amd64 kubectl download and every node we run on is amd64.
      # Building multi-arch here would double the time for nothing.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
